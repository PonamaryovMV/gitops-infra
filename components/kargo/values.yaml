api:
  # UI/API: http://kargo (Traefik + hosts, см. scripts/windows/up.ps1)
  host: kargo
  service:
    type: ClusterIP
  tls:
    enabled: false
    terminatedUpstream: false
  ingress:
    enabled: true
    ingressClassName: traefik
    pathType: Prefix
    tls:
      enabled: false
  # Секрет kargo-api (хэш пароля admin + ключ подписи) создаёт scripts/windows/up.ps1,
  # чтобы ничего секретного не лежало в публичном репозитории.
  secret:
    name: kargo-api
  argocd:
    urls:
      "": http://argocd

controller:
  argocd:
    namespace: argocd
  reconcilers:
    warehouses:
      # Стенд: новые коммиты Jenkins подхватываются за ~30с, а не за 5 минут
      minReconciliationInterval: 30s
